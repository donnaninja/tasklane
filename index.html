<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Tasklane</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left rail (nav + projects), work area on the right, task detail slides in as a drawer. */
:root {
  --bg: #F5F6F3; --surface: #FFFFFF; --sunken: #ECEEE9; --fg: #1C221F; --muted: #646E68; --line: #DADFD8;
  --accent: #2E6A4E; --accent-soft: #E1EDE5; --on-accent: #FFFFFF;
  --info: #35689E; --info-soft: #E2EBF5; --warn: #A85E14; --warn-soft: #F7EADB; --danger: #B23838; --danger-soft: #F7E1E1;
  --ok: #2E7A4C; --ok-soft: #DFF0E5;
  --shadow: 0 1px 2px rgba(20,30,25,.06), 0 6px 24px rgba(20,30,25,.08);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #131715; --surface: #1B201D; --sunken: #232925; --fg: #E5EAE6; --muted: #98A39C; --line: #2F3732;
  --accent: #6DBE93; --accent-soft: #213329; --on-accent: #0E1912;
  --info: #84B2E3; --info-soft: #1F2C3B; --warn: #E3A35F; --warn-soft: #3A2C1C; --danger: #E88383; --danger-soft: #3B2222;
  --ok: #6DBE93; --ok-soft: #1F3328; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.35); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #131715; --surface: #1B201D; --sunken: #232925; --fg: #E5EAE6; --muted: #98A39C; --line: #2F3732;
  --accent: #6DBE93; --accent-soft: #213329; --on-accent: #0E1912;
  --info: #84B2E3; --info-soft: #1F2C3B; --warn: #E3A35F; --warn-soft: #3A2C1C; --danger: #E88383; --danger-soft: #3B2222;
  --ok: #6DBE93; --ok-soft: #1F3328; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.35); color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }

.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); height: 100%; }
.side { background: var(--sunken); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px;
  padding-block: 18px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: 14px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 700; font-size: 20px; padding: 0 6px; }
.brand-mark { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; }
.brand-mark svg { width: 16px; height: 16px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; padding: 0 8px 6px; display: flex; justify-content: space-between; align-items: center; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 7px; border: 0; background: none; text-align: left; width: 100%; font-weight: 500; }
.nav-item:hover { background: var(--line); }
.nav-item.active { background: var(--surface); box-shadow: 0 0 0 1px var(--line); font-weight: 600; }
.nav-item svg { width: 16px; height: 16px; flex: none; color: var(--muted); }
.nav-item .count { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.icon-btn { border: 0; background: none; width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; color: var(--muted); }
.icon-btn:hover { background: var(--line); color: var(--fg); }
.icon-btn svg { width: 16px; height: 16px; }
.side-foot { margin-top: auto; font-size: 12px; color: var(--muted); padding: 0 8px; display: flex; flex-direction: column; gap: 6px; }
.link-btn { border: 0; background: none; padding: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; text-align: left; font-size: 12px; }
.link-btn:hover { color: var(--fg); }

.main { min-width: 0; overflow-y: auto; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  padding-block: 16px 0; padding-left: 28px; padding-right: max(28px, env(safe-area-inset-right, 0px)); }
.top-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.top h1 { font-size: 24px; display: flex; align-items: center; gap: 10px; min-width: 0; }
.top h1 .dot { width: 14px; height: 14px; border-radius: 4px; }
.top-sub { color: var(--muted); margin: 4px 0 0; }
.top-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.tabs { display: flex; gap: 4px; margin-top: 12px; }
.tab { border: 0; background: none; padding: 8px 12px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; display: flex; gap: 6px; align-items: center; }
.tab svg { width: 15px; height: 15px; }
.tab.active { color: var(--fg); border-bottom-color: var(--accent); }
.top.no-tabs { padding-bottom: 16px; }
.menu-btn { display: none; }
.content { padding-block: 22px 60px; padding-left: 28px; padding-right: max(28px, env(safe-area-inset-right, 0px)); }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 8px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn svg { width: 15px; height: 15px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); border-color: var(--danger); color: var(--surface); }
.btn.sm { padding: 4px 9px; font-size: 13px; }

/* List view */
.section { margin-bottom: 26px; }
.section-head { display: flex; align-items: center; gap: 8px; padding: 0 4px 8px; font-weight: 700; font-family: var(--f-display); font-size: 15px; }
.section-head .n { color: var(--muted); font-family: var(--f-body); font-weight: 500; font-size: 13px; font-variant-numeric: tabular-nums; }
.rows { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.row { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.row:hover { background: var(--sunken); }
.row.selected { background: var(--accent-soft); }
.row-title { min-width: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row-title .t { font-weight: 500; overflow-wrap: anywhere; }
.row.is-done .t { color: var(--muted); text-decoration: line-through; }
.row-meta { display: flex; align-items: center; gap: 10px; }
.meta-sub { font-size: 12px; color: var(--muted); display: inline-flex; gap: 3px; align-items: center; font-variant-numeric: tabular-nums; }
.meta-sub svg { width: 13px; height: 13px; }
.add-row { display: flex; gap: 8px; padding: 6px 12px; align-items: center; }
.add-row input { flex: 1; min-width: 0; border: 0; background: none; padding: 5px 0; outline: none; }
.add-row input::placeholder { color: var(--muted); }
.add-row svg { width: 15px; height: 15px; color: var(--muted); flex: none; margin-left: 5px; }

.check { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--muted); background: none; display: grid; place-items: center; padding: 0; color: transparent; }
.check svg { width: 12px; height: 12px; }
.check:hover { border-color: var(--ok); color: var(--ok); }
.check.on { background: var(--ok); border-color: var(--ok); color: var(--surface); }

.avatar { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 10.5px; font-weight: 700; color: #fff; flex: none; letter-spacing: .02em; }
.avatar.none { background: none; border: 1.5px dashed var(--line); color: var(--muted); }
.due { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 66px; text-align: right; white-space: nowrap; }
.due.overdue { color: var(--danger); font-weight: 600; }
.due.soon { color: var(--warn); font-weight: 600; }
.chip { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.chip.high { background: var(--danger-soft); color: var(--danger); }
.chip.medium { background: var(--warn-soft); color: var(--warn); }
.chip.low { background: var(--sunken); color: var(--muted); }
.chip.todo { background: var(--sunken); color: var(--muted); }
.chip.doing { background: var(--info-soft); color: var(--info); }
.chip.done { background: var(--ok-soft); color: var(--ok); }
.proj-chip { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
.proj-chip .dot { width: 8px; height: 8px; border-radius: 2px; }

/* Board view */
.board-wrap { overflow-x: auto; padding-bottom: 10px; }
.board { display: grid; grid-template-columns: repeat(3, minmax(260px, 1fr)); gap: 14px; align-items: start; min-width: 820px; }
.col { background: var(--sunken); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 160px; border: 2px solid transparent; }
.col.drop { border-color: var(--accent); border-style: dashed; }
.col-head { display: flex; align-items: center; gap: 8px; padding: 2px 4px 4px; font-weight: 700; font-family: var(--f-display); }
.col-head .n { color: var(--muted); font-family: var(--f-body); font-weight: 500; font-size: 13px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; cursor: grab; }
.card:hover { border-color: var(--muted); }
.card.dragging { opacity: .45; }
.card-title { font-weight: 600; overflow-wrap: anywhere; }
.card.is-done .card-title { color: var(--muted); text-decoration: line-through; }
.card-foot { display: flex; align-items: center; gap: 8px; }
.card-foot .due { margin-left: auto; min-width: 0; }
.progress { height: 4px; background: var(--sunken); border-radius: 4px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--ok); }
.col-add { border: 1px dashed var(--line); background: none; border-radius: 8px; padding: 7px; color: var(--muted); font-weight: 600; text-align: left; display: flex; gap: 6px; align-items: center; }
.col-add:hover { color: var(--fg); border-color: var(--muted); }
.col-add svg { width: 14px; height: 14px; }

/* Drawer */
.scrim { position: fixed; inset: 0; background: rgba(10,15,12,.28); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow);
  z-index: 30; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); animation: slide .18s ease-out; }
@keyframes slide { from { transform: translateX(24px); opacity: .6; } to { transform: none; opacity: 1; } }
.drawer-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.drawer-body { padding: 18px 20px 30px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
.title-input { font-family: var(--f-display); font-size: 21px; font-weight: 700; border: 1px solid transparent; border-radius: 8px; padding: 4px 6px; margin: -4px -6px; background: none; width: calc(100% + 12px); resize: none; }
.title-input:hover, .title-input:focus { border-color: var(--line); outline: none; }
.fields { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px 12px; align-items: center; }
.fields label { color: var(--muted); font-size: 13px; }
.field { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 6px 8px; width: 100%; }
textarea.field { min-height: 90px; resize: vertical; line-height: 1.5; }
.block-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin-bottom: 8px; display: flex; justify-content: space-between; }
.subs { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.sub { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-bottom: 1px solid var(--line); }
.sub .check { width: 18px; height: 18px; }
.sub span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.sub.done span { color: var(--muted); text-decoration: line-through; }
.sub .icon-btn { opacity: .5; }
.sub:hover .icon-btn { opacity: 1; }

/* Modal */
.modal-wrap { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(10,15,12,.35); padding: 16px; }
.modal { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); width: min(520px, 100%); max-height: calc(100% - 20px); overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 16px; }
.modal h2 { font-size: 20px; }
.form-grid { display: flex; flex-direction: column; gap: 6px; }
.form-grid label { font-weight: 600; font-size: 13px; }
.hint { color: var(--muted); font-size: 12.5px; margin: 0; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
.choice-list { display: flex; flex-direction: column; gap: 6px; }
.choice { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; cursor: pointer; }
.choice:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.choice input { margin-top: 3px; accent-color: var(--accent); }
.choice b { display: block; }
.choice small { color: var(--muted); }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { width: 26px; height: 26px; border-radius: 7px; border: 2px solid transparent; padding: 0; }
.swatch.on { border-color: var(--fg); }

/* Templates & connect pages */
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel h3 { font-size: 17px; }
.panel p { margin: 0; color: var(--muted); }
.tpl-tasks { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 5px; font-size: 13px; }
.tpl-tasks li { display: flex; gap: 8px; align-items: baseline; }
.tpl-tasks li::before { content: ""; width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--muted); flex: none; transform: translateY(1px); }
.tpl-tasks .more { color: var(--muted); }
.tpl-tasks .more::before { display: none; }
.panel-actions { display: flex; gap: 8px; margin-top: auto; flex-wrap: wrap; }
.tag { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--accent); }

.notice { background: var(--info-soft); color: var(--fg); border-radius: 10px; padding: 12px 14px; margin-bottom: 20px; display: flex; gap: 10px; align-items: flex-start; }
.notice svg { width: 18px; height: 18px; color: var(--info); flex: none; margin-top: 1px; }
.conn-section { margin-bottom: 32px; }
.conn-section > h2 { font-size: 19px; margin-bottom: 4px; }
.conn-section > .hint { margin-bottom: 14px; font-size: 13.5px; max-width: 68ch; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
.code { font-family: var(--f-mono); font-size: 12.5px; background: var(--sunken); border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px; overflow-x: auto; white-space: pre; margin: 0; line-height: 1.6; }
.code-wrap { position: relative; }
.code-wrap .btn { position: absolute; top: 8px; right: 8px; }

/* Faux website for the widget preview */
.site { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.site-bar { background: var(--sunken); padding: 8px 12px; display: flex; gap: 6px; align-items: center; border-bottom: 1px solid var(--line); }
.site-bar i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.site-bar span { margin-left: 8px; font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); background: var(--surface); padding: 2px 10px; border-radius: 99px; }
.site-body { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.site-body .fake-h { height: 12px; width: 55%; background: var(--sunken); border-radius: 4px; }
.site-body .fake-p { height: 8px; width: 85%; background: var(--sunken); border-radius: 4px; }
.widget { border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); }
.widget h4 { margin: 0; font-family: var(--f-display); font-size: 16px; }
.widget .field { font-size: 13.5px; }
.widget button[type="submit"] { border: 0; border-radius: 8px; padding: 9px; font-weight: 700; color: #fff; }
.wh-list { display: flex; flex-direction: column; gap: 6px; }
.wh { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; flex-wrap: wrap; }
.wh code { font-family: var(--f-mono); font-size: 12.5px; overflow-wrap: anywhere; min-width: 0; flex: 1; }
.log { font-family: var(--f-mono); font-size: 12px; color: var(--muted); max-height: 180px; overflow: auto; background: var(--sunken); border-radius: 9px; padding: 10px 12px; white-space: pre-wrap; margin: 0; }
.inline-form { display: flex; gap: 8px; flex-wrap: wrap; }
.inline-form .field { flex: 1; min-width: 160px; width: auto; }

.empty { text-align: center; color: var(--muted); padding: 40px 16px; border: 1px dashed var(--line); border-radius: 12px; }
.empty b { color: var(--fg); display: block; font-family: var(--f-display); font-size: 17px; margin-bottom: 4px; }

.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 50; box-shadow: var(--shadow); max-width: calc(100% - 32px); }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; top: 0; bottom: 0; left: 0; width: 264px; z-index: 35; transform: translateX(-105%); transition: transform .2s; padding-top: calc(18px + env(safe-area-inset-top, 0px)); }
  .side.open { transform: none; box-shadow: var(--shadow); }
  .menu-btn { display: grid; }
  .top, .content { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .top { top: env(safe-area-inset-top, 0px); }
  .two { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 520px) {
  .row { grid-template-columns: 26px minmax(0, 1fr); }
  .row-meta { grid-column: 2; flex-wrap: wrap; }
  .due { text-align: left; min-width: 0; }
  .top-actions { margin-left: 0; width: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
</style>
</head>
<body>

<div class="app">
  <aside class="side" id="side"></aside>
  <main class="main" id="main"></main>
</div>
<div id="layer"></div>
<div id="toast" class="toast" hidden></div>

<script>
const I = {
  check: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>',
  home: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M5.5 8.2l1.8 1.8 3.3-3.6"/></svg>',
  tpl: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1" stroke-dasharray="2 1.5"/></svg>',
  plug: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 9.5l3-3M7 4.5l1-1a2.5 2.5 0 013.5 3.5l-1 1M9 11.5l-1 1A2.5 2.5 0 014.5 9l1-1"/></svg>',

const uid = p => p + Math.random().toString(36).slice(2, 9);
const pad = n => String(n).padStart(2, '0');
function dayStr(offset) { const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() + offset); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function dayDiff(s) { if (!s) return null; const [y, m, d] = s.split('-').map(Number); const t = new Date(); t.setHours(12, 0, 0, 0); return Math.round((new Date(y, m - 1, d, 12) - t) / 864e5); }
function dueLabel(s) {
  const n = dayDiff(s); if (n === null) return '';
  if (n === 0) return 'Today'; if (n === 1) return 'Tomorrow'; if (n === -1) return 'Yesterday';
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function dueHtml(t) {
  if (!t.due) return '<span class="due"></span>';
  const n = dayDiff(t.due); const cls = t.status !== 'done' && n < 0 ? 'overdue' : t.status !== 'done' && n <= 1 ? 'soon' : '';
  return `<span class="due ${cls}">${dueLabel(t.due)}</span>`;
}

function rowHtml(t, showProject) {
  const done = t.subtasks.filter(s => s.done).length; const p = project(t.projectId);

}
const byDue = (a, b) => (a.due || '9999') < (b.due || '9999') ? -1 : (a.due || '9999') > (b.due || '9999') ? 1 : 0;

function renderHome() {
  const mine = S.tasks.filter(t => t.assignee === ME && t.status !== 'done').sort(byDue);
  const groups = [
    ['Overdue', mine.filter(t => t.due && dayDiff(t.due) < 0)],
    ['Today and tomorrow', mine.filter(t => t.due && dayDiff(t.due) >= 0 && dayDiff(t.due) <= 1)],
    ['Next 7 days', mine.filter(t => t.due && dayDiff(t.due) > 1 && dayDiff(t.due) <= 7)],
    ['Later', mine.filter(t => t.due && dayDiff(t.due) > 7)],
    ['No due date', mine.filter(t => !t.due)]
  ].filter(g => g[1].length);
  const today = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  return header('My tasks', `${today} · ${mine.length} open task${mine.length === 1 ? '' : 's'} assigned to you`, `<button class="btn primary" data-act="new-project">${I.plus}New project</button>`) +
    `<div class="content">${groups.length ? groups.map(([name, list]) => `<div class="section"><div class="section-head">${name}<span class="n">${list.length}</span></div>
      <div class="rows">${list.map(t => rowHtml(t, true)).join('')}</div></div>`).join('')

}

    <section class="conn-section"><h2>API access</h2>
      <p class="hint">For developers: create and update tasks from your own code. Keep this key private.</p>
      <div class="panel">
        <div class="form-grid"><label>API key</label><div class="inline-form"><input class="field" id="api-key" value="${S.apiKey}" readonly style="font-family:var(--f-mono)"><button class="btn" data-act="copy" data-target="api-key">Copy</button><button class="btn" data-act="new-key">New key</button></div></div>
        <div class="form-grid"><label>Example: create a task</label><div class="code-wrap"><pre class="code" id="curl">${esc(curl)}</pre><button class="btn sm" data-act="copy" data-target="curl">Copy</button></div></div>
      </div>
    </section></div>`;
}

/* ---------- Drawer & modals ---------- */
function renderLayer() {
  const layer = document.getElementById('layer');
  let html = '';
  if (ui.sideOpen) html += '<div class="scrim" data-act="close-side"></div>';
  const t = ui.openTask && task(ui.openTask);
  if (t) {
    const p = project(t.projectId);
    html += `<div class="scrim" data-act="close-task"></div><aside class="drawer" role="dialog" aria-label="Task details">
      <div class="drawer-head"><button class="btn sm ${t.status === 'done' ? 'primary' : ''}" data-act="toggle" data-id="${t.id}">${I.check}${t.status === 'done' ? 'Completed' : 'Mark complete'}</button>
        <span class="proj-chip" style="margin-left:6px"><span class="dot" style="background:${p.color}"></span>${esc(p.name)}</span>
        <button class="icon-btn" style="margin-left:auto" data-act="close-task" aria-label="Close">${I.x}</button></div>
      <div class="drawer-body">
        <textarea class="title-input" id="d-title" rows="1" data-field="title">${esc(t.title)}</textarea>
        <div class="fields">
          <label for="d-assignee">Assignee</label><select class="field" id="d-assignee" data-field="assignee"><option value="">Unassigned</option>${S.people.map(x => `<option value="${x.id}" ${x.id === t.assignee ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>
          <label for="d-due">Due date</label><input class="field" type="date" id="d-due" data-field="due" value="${t.due}">
          <label for="d-status">Status</label><select class="field" id="d-status" data-field="status">${STATUSES.map(([k, n]) => `<option value="${k}" ${k === t.status ? 'selected' : ''}>${n}</option>`).join('')}</select>
          <label for="d-priority">Priority</label><select class="field" id="d-priority" data-field="priority">${['low', 'medium', 'high'].map(k => `<option value="${k}" ${k === t.priority ? 'selected' : ''}>${k[0].toUpperCase() + k.slice(1)}</option>`).join('')}</select>
          <label for="d-project">Project</label><select class="field" id="d-project" data-field="projectId">${S.projects.map(x => `<option value="${x.id}" ${x.id === t.projectId ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>
        </div>
        <div><div class="block-label"><label for="d-desc">Description</label></div><textarea class="field" id="d-desc" data-field="desc" placeholder="Add details, links or notes…">${esc(t.desc)}</textarea></div>
        <div><div class="block-label">Subtasks <span>${t.subtasks.filter(s => s.done).length}/${t.subtasks.length}</span></div>
          <div class="subs">${t.subtasks.map(s => `<div class="sub ${s.done ? 'done' : ''}"><button class="check ${s.done ? 'on' : ''}" data-act="toggle-sub" data-id="${s.id}" aria-label="Toggle subtask">${I.check}</button><span>${esc(s.title)}</span><button class="icon-btn" data-act="del-sub" data-id="${s.id}" aria-label="Remove subtask">${I.x}</button></div>`).join('')}
          <form class="add-row" data-form="sub">${I.plus}<input id="d-newsub" name="title" placeholder="Add a subtask…" autocomplete="off"></form></div></div>
        <div><button class="btn danger ${ui.armDelete === t.id ? 'armed' : ''}" data-act="del-task" data-id="${t.id}">${ui.armDelete === t.id ? 'Click again to delete' : 'Delete task'}</button></div>
      </div></aside>`;
  }
  if (ui.modal === 'project') {
    html += `<div class="modal-wrap" data-act="close-modal-bg"><form class="modal" data-form="project">
      <h2>New project</h2>
      <div class="form-grid"><label for="np-name">Project name</label><input class="field" id="np-name" name="name" required placeholder="e.g. Smith & Co website" value="${esc(ui.modalName || '')}"></div>
      <div class="form-grid"><label>Color</label><div class="swatches">${COLORS.map((c, i) => `<button type="button" class="swatch ${c === (ui.modalColor || COLORS[0]) ? 'on' : ''}" style="background:${c}" data-act="np-color" data-color="${c}" aria-label="Color ${i + 1}"></button>`).join('')}</div></div>
      <div class="form-grid"><label>Start from</label><div class="choice-list">
        <label class="choice"><input type="radio" name="tpl" value="" ${!ui.modalTpl ? 'checked' : ''}><span><b>Blank project</b><small>Add your own tasks</small></span></label>
        ${S.templates.map(tp => `<label class="choice"><input type="radio" name="tpl" value="${tp.id}" ${ui.modalTpl === tp.id ? 'checked' : ''}><span><b>${esc(tp.name)}</b><small>${tp.tasks.length} tasks · ${esc(tp.desc || '')}</small></span></label>`).join('')}
      </div></div>
      <div class="modal-actions"><button type="button" class="btn" data-act="close-modal">Cancel</button><button class="btn primary">Create project</button></div></form></div>`;
  }
  if (ui.modal === 'template') {
    html += `<div class="modal-wrap" data-act="close-modal-bg"><form class="modal" data-form="template">
      <h2>New template</h2>
      <div class="form-grid"><label for="nt-name">Template name</label><input class="field" id="nt-name" name="name" required placeholder="e.g. Monthly website care"></div>
      <div class="form-grid"><label for="nt-desc">Short description</label><input class="field" id="nt-desc" name="desc" placeholder="What is it for?"></div>
      <div class="form-grid"><label for="nt-tasks">Tasks</label><textarea class="field" id="nt-tasks" name="tasks" required style="min-height:150px;font-family:var(--f-mono);font-size:13px" placeholder="Update plugins\n- Back up first\n- Check site after\nReview analytics\nSend report to client"></textarea>
        <p class="hint">One task per line. Start a line with a dash to make it a subtask of the task above it.</p></div>
      <div class="modal-actions"><button type="button" class="btn" data-act="close-modal">Cancel</button><button class="btn primary">Save template</button></div></form></div>`;
  }
  layer.innerHTML = html;
}

function render() {
  renderSide();
  const main = document.getElementById('main');
  const scroll = main.scrollTop;
  main.innerHTML = ui.view === 'project' ? renderProject() : ui.view === 'templates' ? renderTemplates() : ui.view === 'connect' ? renderConnect() : renderHome();
  main.scrollTop = scroll;
  renderLayer();
  save();
}

/* ---------- Actions ---------- */
function addTask(projectId, title, status, extra = {}) {
  const t = { id: uid('t'), projectId, title, status, assignee: ME, due: '', priority: 'medium', desc: '', subtasks: [], created: Date.now(), ...extra };
  S.tasks.push(t); notify('task.created', t); return t;
}
function setStatus(t, status) {
  const was = t.status; t.status = status;
  if (status === 'done' && was !== 'done') { notify('task.completed', t); toast(`Completed: ${t.title}`); }
}
function createFromTemplate(tp, name, color) {
  const p = { id: uid('pr'), name, color, desc: `Started from the "${tp.name}" template.` };
  S.projects.push(p);
  tp.tasks.forEach(x => S.tasks.push({ id: uid('t'), projectId: p.id, title: x.title, status: 'todo', assignee: '', due: x.offset == null ? '' : dayStr(x.offset),
    priority: x.priority || 'medium', desc: '', subtasks: (x.subtasks || []).map(s => ({ id: uid('s'), title: s, done: false })), created: Date.now() }));
  return p;
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (act !== 'del-task' && act !== 'del-template') ui.armDelete = false;
  switch (act) {
    case 'go': ui.view = el.dataset.view; ui.sideOpen = false; ui.openTask = null; break;
    case 'open-project': ui.view = 'project'; ui.projectId = id; ui.sideOpen = false; ui.openTask = null; break;
    case 'menu': ui.sideOpen = true; break;
    case 'close-side': ui.sideOpen = false; break;
    case 'mode': ui.mode = el.dataset.mode; break;
    case 'open-task': ui.openTask = id; break;
    case 'close-task': ui.openTask = null; break;
    case 'toggle': { e.stopPropagation(); const t = task(id); setStatus(t, t.status === 'done' ? 'todo' : 'done'); break; }
    case 'toggle-sub': { const s = task(ui.openTask).subtasks.find(s => s.id === id); s.done = !s.done; break; }
    case 'del-sub': { const t = task(ui.openTask); t.subtasks = t.subtasks.filter(s => s.id !== id); break; }
    case 'del-task': if (ui.armDelete === id) { const t = task(id); S.tasks = S.tasks.filter(x => x.id !== id); ui.openTask = null; ui.armDelete = false; toast(`Deleted: ${t.title}`); } else ui.armDelete = id; break;
    case 'quick-add': { const t = addTask(ui.projectId, 'New task', el.dataset.status); ui.openTask = t.id; render(); const ti = document.getElementById('d-title'); ti.focus(); ti.select(); return; }
    case 'new-project': ui.modal = 'project'; ui.modalTpl = el.dataset.tpl || ''; ui.modalName = ''; ui.modalColor = COLORS[S.projects.length % COLORS.length]; ui.sideOpen = false; render(); document.getElementById('np-name').focus(); return;
    case 'np-color': { const f = el.closest('form'); ui.modalName = f.name.value; ui.modalTpl = f.tpl.value; ui.modalColor = el.dataset.color; break; }
    case 'use-template': ui.modal = 'project'; ui.modalTpl = id; ui.modalName = ''; ui.modalColor = COLORS[S.projects.length % COLORS.length]; render(); document.getElementById('np-name').focus(); return;
    case 'new-template': ui.modal = 'template'; render(); document.getElementById('nt-name').focus(); return;
    case 'close-modal': ui.modal = null; break;
    case 'close-modal-bg': if (e.target !== el) return; ui.modal = null; break;
    case 'del-template': if (ui.armDelete === id) { S.templates = S.templates.filter(x => x.id !== id); ui.armDelete = false; toast('Template deleted'); } else ui.armDelete = id; break;
    case 'save-template': {
      const p = project(ui.projectId); const list = S.tasks.filter(t => t.projectId === p.id);
      S.templates.push({ id: uid('tp'), name: p.name, desc: `Saved from the ${p.name} project.`, tasks: list.map(t => ({ title: t.title, priority: t.priority, offset: t.due ? Math.max(0, dayDiff(t.due)) : null, subtasks: t.subtasks.map(s => s.title) })) });
      toast(`Saved "${p.name}" as a template with ${list.length} tasks`); break;
    }
    case 'w-color': S.widget.color = el.dataset.color; break;
    case 'del-hook': S.webhooks = S.webhooks.filter(h => h.id !== id); break;
    case 'new-key': S.apiKey = 'tl_live_' + Math.random().toString(36).slice(2, 14); toast('New API key created. The old one stops working.'); break;
    case 'copy': {
      const target = document.getElementById(el.dataset.target); const text = target.value ?? target.textContent;
      const fallback = () => { const r = document.createRange(); r.selectNodeContents(target); if (target.select) target.select(); else { const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast('Selected. Press Ctrl+C or ⌘C to copy.'); };
      try { navigator.clipboard.writeText(text).then(() => toast('Copied'), fallback); } catch (err) { fallback(); }
      return;
    }
    case 'reset': S = seed(); ui.view = 'home'; ui.openTask = null; ui.log = []; ui.sideOpen = false; toast('Example data restored'); break;
    default: return;
  }
  render();
});

document.addEventListener('submit', e => {
  const f = e.target; const kind = f.dataset.form; if (!kind) return;
  e.preventDefault();
  if (kind === 'add') { const v = f.title.value.trim(); if (!v) return; addTask(ui.projectId, v, f.dataset.status); render(); document.getElementById('add-' + f.dataset.status)?.focus(); return; }
  if (kind === 'sub') { const v = f.title.value.trim(); if (!v) return; task(ui.openTask).subtasks.push({ id: uid('s'), title: v, done: false }); render(); document.getElementById('d-newsub').focus(); return; }
  if (kind === 'project') {
    const name = f.name.value.trim(); if (!name) return; const tpl = S.templates.find(x => x.id === f.tpl.value); const color = ui.modalColor || COLORS[0];
    const p = tpl ? createFromTemplate(tpl, name, color) : (S.projects.push({ id: uid('pr'), name, color, desc: '' }), S.projects[S.projects.length - 1]);
    ui.modal = null; ui.view = 'project'; ui.projectId = p.id; ui.mode = 'list'; toast(tpl ? `Created ${name} with ${tpl.tasks.length} tasks` : `Created ${name}`);
  }
  if (kind === 'template') {
    const tasks = [];
    f.tasks.value.split('\n').map(l => l.trim()).filter(Boolean).forEach(l => {
      if (/^[-*•]\s*/.test(l) && tasks.length) tasks[tasks.length - 1].subtasks.push(l.replace(/^[-*•]\s*/, ''));
      else tasks.push({ title: l.replace(/^[-*•]\s*/, ''), priority: 'medium', offset: null, subtasks: [] });
    });
    S.templates.push({ id: uid('tp'), name: f.name.value.trim(), desc: f.desc.value.trim(), tasks });
    ui.modal = null; toast(`Template saved with ${tasks.length} tasks`);
  }
  if (kind === 'hook') { S.webhooks.push({ id: uid('w'), url: f.url.value.trim(), event: f.event.value }); toast('Notification added'); }
  if (kind === 'widget') {
    const pid = S.widget.projectId; const t = addTask(pid, f.msg.value.trim().split('\n')[0].slice(0, 80), 'todo',
      { assignee: '', priority: 'medium', desc: `Website request from ${f.name.value.trim()}${f.email.value ? ` (${f.email.value.trim()})` : ''}:\n\n${f.msg.value.trim()}` });
    f.reset(); toast(`Request added to ${project(pid).name}`);
  }
  render();
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.field) {
    const t = task(ui.openTask); if (!t) return; const k = el.dataset.field;
    if (k === 'status') setStatus(t, el.value); else if (k === 'title') t.title = el.value.trim() || 'Untitled task'; else t[k] = el.value;
    render(); return;
  }
  if (el.dataset.widget) { S.widget[el.dataset.widget] = el.value; render(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (ui.modal) ui.modal = null; else if (ui.openTask) ui.openTask = null; else if (ui.sideOpen) ui.sideOpen = false; else return; render(); }
  if (e.key === 'Enter' && e.target.id === 'd-title') { e.preventDefault(); e.target.blur(); }
});

/* Board drag and drop */
document.addEventListener('dragstart', e => { const c = e.target.closest?.('.card'); if (!c) return; e.dataTransfer.setData('text/plain', c.dataset.id); c.classList.add('dragging'); });
document.addEventListener('dragend', e => { e.target.closest?.('.card')?.classList.remove('dragging'); document.querySelectorAll('.col.drop').forEach(c => c.classList.remove('drop')); });
document.addEventListener('dragover', e => { const col = e.target.closest?.('.col'); if (!col) return; e.preventDefault(); document.querySelectorAll('.col.drop').forEach(c => c !== col && c.classList.remove('drop')); col.classList.add('drop'); });
document.addEventListener('drop', e => { const col = e.target.closest?.('.col'); if (!col) return; e.preventDefault(); const t = task(e.dataTransfer.getData('text/plain')); if (t && t.status !== col.dataset.col) { setStatus(t, col.dataset.col); render(); } });

render();
</script>
</body>
</html>
